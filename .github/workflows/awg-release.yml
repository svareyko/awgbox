name: AWG release

on:
  push:
    tags:
      - 'v*-awg.*'
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to build, without the leading v (e.g. 1.14.4-awg.1)'
        required: true
        type: string

permissions:
  contents: write

env:
  GOTOOLCHAIN: local

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: Setup Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.5'
          check-latest: false
      - name: Resolve version
        id: version
        shell: bash
        env:
          INPUT_VERSION: ${{ inputs.version }}
        run: |
          if [ "${GITHUB_REF_TYPE}" = "tag" ]; then
            version="${GITHUB_REF_NAME#v}"
          else
            version="${INPUT_VERSION#v}"
          fi
          if [ -z "$version" ]; then
            echo "version is empty" >&2
            exit 1
          fi
          echo "version=$version" >> "$GITHUB_OUTPUT"
      - name: Build
        shell: pwsh
        run: ./build/build.ps1 -Version '${{ steps.version.outputs.version }}'
      - name: Upload artifacts
        uses: actions/upload-artifact@v4
        with:
          name: sing-box-${{ steps.version.outputs.version }}
          path: dist/${{ steps.version.outputs.version }}
          if-no-files-found: error
      - name: Create GitHub release
        if: github.ref_type == 'tag'
        uses: softprops/action-gh-release@v2
        with:
          draft: false
          prerelease: false
          generate_release_notes: false
          files: |
            dist/${{ steps.version.outputs.version }}/*.tar.gz
            dist/${{ steps.version.outputs.version }}/*.zip
            dist/${{ steps.version.outputs.version }}/SHA256SUMS
            dist/${{ steps.version.outputs.version }}/SHA256SUMS.binaries
